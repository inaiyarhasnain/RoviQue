spring.application.name=product
server.port=8081
security.jwt.secret=${AUTH_JWT_SECRET}
security.jwt.issuer=${AUTH_JWT_ISSUER:http://localhost:8085}
security.jwt.audience=${AUTH_JWT_AUDIENCE:rovique-api}

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/product_db?createDatabaseIfNotExist=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=${PRODUCT_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# AWS S3 Configuration
aws.region=eu-north-1
aws.bucket-name=rovique
aws.access-key=${AWS_ACCESS_KEY_ID:}
aws.secret-key=${AWS_SECRET_ACCESS_KEY:}

# Multipart upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka Configuration
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.instance.prefer-ip-address=true