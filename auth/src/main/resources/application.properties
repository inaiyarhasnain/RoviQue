spring.application.name=auth
server.port=8085

spring.datasource.url=${AUTH_DB_URL:jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${AUTH_DB_USERNAME:root}
spring.datasource.password=${AUTH_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

auth.jwt.issuer=${AUTH_JWT_ISSUER:http://localhost:8085}
auth.jwt.secret=${AUTH_JWT_SECRET}
auth.jwt.access-token-ttl=${AUTH_JWT_ACCESS_TOKEN_TTL:PT15M}
auth.refresh-token-ttl=${AUTH_REFRESH_TOKEN_TTL:P30D}
auth.refresh-cookie-secure=${AUTH_REFRESH_COOKIE_SECURE:true}
auth.refresh-cookie-same-site=${AUTH_REFRESH_COOKIE_SAME_SITE:Strict}
auth.cors.allowed-origins=${AUTH_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
