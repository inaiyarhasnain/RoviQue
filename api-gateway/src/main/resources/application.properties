# Application Name
spring.application.name=api-gateway

# Server Port
server.port=8080

# Product Service Route
spring.cloud.gateway.server.webflux.routes[0].id=product
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/product/**

# Cart Service Route
spring.cloud.gateway.server.webflux.routes[1].id=cart
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/cart/**

# Order Service Route
spring.cloud.gateway.server.webflux.routes[2].id=order
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/order/**

# Payment Service Route
spring.cloud.gateway.server.webflux.routes[3].id=payment
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8084
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/payment/**

# Auth Service Route
spring.cloud.gateway.server.webflux.routes[4].id=auth
spring.cloud.gateway.server.webflux.routes[4].uri=lb://auth
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/v1/auth/**

# All services must receive the same Base64-encoded 256-bit-or-longer HS256 secret.
security.jwt.secret=${AUTH_JWT_SECRET}
security.jwt.issuer=${AUTH_JWT_ISSUER:http://localhost:8085}
security.jwt.audience=${AUTH_JWT_AUDIENCE:rovique-api}

# Configure explicit browser origins instead of wildcard CORS.
gateway.cors.allowed-origins=${ROVIQUE_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Actuator
#management.endpoints.web.exposure.include=health,info
#management.endpoint.health.show-details=always